<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Library Wallet Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- Chart.js CDN -->
</head>
<body>
  <div class="container">
    <h1>📚 My Library Wallet</h1>
    <h2 id="monthDisplay"></h2>
    
    <div class="info">
      <p>Your Remaining Balance for <span id="monthText"></span>:</p>
      <h3>₹<span id="remaining">0</span></h3>
    </div>

    <div class="form-group">
      <label for="amount">💸 Add or Update Wallet</label>
      <input type="number" id="amount" placeholder="Enter amount in ₹" />
      <button onclick="updateMoney()">Update Wallet</button>
    </div>

    <button class="budget-btn" onclick="generateBudget()">Generate 50/30/20 Budget</button>
    
    <div class="budget-result" id="budget"></div>
    <canvas id="budgetChart" width="400" height="400"></canvas>
  </div>

  <script src="script.js"></script>
</body>
</html>
